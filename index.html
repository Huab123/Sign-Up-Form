<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    <title> Sign-Up Form </title>
</head>
<body>
    <div class="page">
        <div class="sidebar">
            <div class="banner">
                <img src="images/banner-icon.png" draggable="false"> 
                <p> POSEIDON </p>
            </div>
        </div>
        <div class="content">
            <div class="info">
                <p> This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up now to get started.</p>
                <p> You know you want to.</p>
            </div>
            <div class="sign-up">
                <p class="title"> Let's do this! </p>
                <form>
                    <div class="inputs">
                        <div class="input">
                            <label for="firstName"> First Name </label>
                            <input type="text" id="firstName" name="firstName" required>
                        </div>
                        <div class="input">
                            <label for="lastName"> Last Name </label>
                            <input type="text" id="lastName" name="lastName" required>
                        </div>
                        <div class="input">
                            <label for="email"> Email </label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="input">
                            <label for="phone"> Phone Number </label>
                            <input type="tel" id="phone" name="phone" required>
                        </div>
                        <div class="input">
                            <label for="password"> Password </label>
                            <input type="password" id="password" name="password" required>
                        </div>
                        <div class="input">
                            <label for="confirmPassword"> Confirm  Password </label>
                            <input type="password" id="password" name="confirmPassword" required>
                        </div>
                    </div>

                    <div class="submit">
                        <button type="submit"> Create Account </button>

                        <div class="login">
                            Already have an account? <a href=""> Log In </a>
                        </div>
                    </div>
                </form>
            </div>
            
        </div>
    </div>
   
    
</body>
